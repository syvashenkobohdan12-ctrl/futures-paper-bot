name: smc-backtest
on:
  push:
    branches: [smc-backtest]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - run: set -o pipefail; mkdir -p smc_results && python tjr.py | tee smc_results/tjr_report.txt
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
      - name: Save results to the branch
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -f smc_results
          git diff --cached --quiet && exit 0
          git commit -q -m "smc backtest results [skip ci]"
          git push -q
