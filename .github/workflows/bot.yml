name: paper-bot
on:
  schedule:
    - cron: "5 * * * *"        # every hour at :05 UTC (GitHub may start it a few minutes late; missed hours are replayed)
  workflow_dispatch: {}         # "Run workflow" button for a manual run
permissions:
  contents: write
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python live_bot.py
      - run: cp dashboard.html index.html    # GitHub Pages serves index.html at the site root
      - name: Save state back to the repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -f paper_*.* dashboard.html index.html
          git diff --cached --quiet && exit 0
          git commit -q -m "paper bot run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
